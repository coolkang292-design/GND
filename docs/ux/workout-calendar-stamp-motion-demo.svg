<text x="290" y="155" text-anchor="middle" class="muted">수</text><rect x="250" y="170" width="80" height="110" rx="13" fill="#181B21" stroke="#33373E" stroke-width="1"/><text x="260" y="190" class="muted small">21</text>
<text x="382" y="155" text-anchor="middle" class="muted">목</text><rect x="342" y="170" width="80" height="110" rx="13" fill="#181B21" stroke="#33373E" stroke-width="1"/><text x="352" y="190" class="muted small">22</text>
<text x="474" y="155" text-anchor="middle" class="muted">금</text><rect x="434" y="170" width="80" height="110" rx="13" fill="#181B21" stroke="#33373E" stroke-width="1"/><text x="444" y="190" class="muted small">23</text>
<text x="566" y="155" text-anchor="middle" class="muted">토</text><rect x="526" y="170" width="80" height="110" rx="13" fill="#181B21" stroke="#33373E" stroke-width="1"/><text x="536" y="190" class="muted small">24</text>
