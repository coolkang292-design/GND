<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-label="운동 완료 달력 도장 찍기 반복 시안">
<style>
  text {font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
  .muted {fill:#9CA3AF;font-size:15px;font-weight:700;}
  .small {font-size:12px;}
  .imprint {transform-box:fill-box;transform-origin:center;animation:stamp 3.5s ease-in-out infinite;}
  .shock {fill:none;stroke:#C8FF3D;stroke-width:2.5px;transform-box:fill-box;transform-origin:center;animation:ring 3.5s infinite;}
  .sound {fill:#C8FF3D;font-size:16px;font-weight:900;animation:word 3.5s infinite;}
  @keyframes stamp {
    0%,10% {opacity:0;transform:translateY(-24px) scale(1.48) rotate(-10deg);}
    22% {opacity:1;transform:translateY(2px) scale(.86) rotate(2deg);}
    30% {transform:translateY(-4px) scale(1.08);}
    42%,100% {opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes ring {
    0%,20% {opacity:0;transform:scale(.4);}
    24% {opacity:.8;transform:scale(.95);}
    42%,100% {opacity:0;transform:scale(1.6);}
  }
  @keyframes word {
    0%,19% {opacity:0;}
    25% {opacity:1;}
    42%,100% {opacity:0;}
  }
  @media (prefers-reduced-motion:reduce) {
    .imprint,.shock,.sound {animation:none;}
    .imprint {opacity:1;}
    .shock,.sound {display:none;}
  }
</style>
<rect width="840" height="400" rx="24" fill="#090A0C"/>
<rect x="23" y="22" width="794" height="351" rx="18" fill="#111318" stroke="#25282E"/>
