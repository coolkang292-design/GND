<text x="1234" y="205" fill="#F5F7F9" font-size="23" font-weight="800" >구현 핵심 규칙</text>
<path d="M 1234 223 L 1542 223" stroke="#343B44" stroke-width="1" fill="none"/>
<text x="1234" y="263" fill="#C9FF3D" font-size="18" font-weight="800" >1. 성취를 먼저</text>
<text x="1234" y="291" fill="#F5F7F9" font-size="14" font-weight="600" >완료 축하 → 실제 수치 3개</text>
<text x="1234" y="314" fill="#9CA5B3" font-size="13" font-weight="500" >불확실한 비교 수치는 노출 금지</text>
<text x="1234" y="358" fill="#C9FF3D" font-size="18" font-weight="800" >2. 인증 상태 구분</text>
<text x="1234" y="386" fill="#F5F7F9" font-size="14" font-weight="600" >대기 = 예정(+1일 미확정)</text>
<text x="1234" y="409" fill="#F5F7F9" font-size="14" font-weight="600" >완료 = 확정(반영 확인 시)</text>
<text x="1234" y="432" fill="#F5F7F9" font-size="14" font-weight="600" >불필요 = 인증 CTA 미노출</text>
<text x="1234" y="474" fill="#C9FF3D" font-size="18" font-weight="800" >3. 기존 기능 유지</text>
<text x="1234" y="502" fill="#F5F7F9" font-size="14" font-weight="600" >사진 촬영/앨범, XP/배지, AI</text>
<text x="1234" y="525" fill="#F5F7F9" font-size="14" font-weight="600" >기록, 챌린지 기여, 캡션</text>
<text x="1234" y="548" fill="#F5F7F9" font-size="14" font-weight="600" >상세 정보는 접힘 영역 활용</text>
<text x="1234" y="592" fill="#C9FF3D" font-size="18" font-weight="800" >4. 공개/비공개 보호</text>
<text x="1234" y="620" fill="#F5F7F9" font-size="14" font-weight="600" >공개 운동만 해당 피드로 링크</text>
<text x="1234" y="643" fill="#F5F7F9" font-size="14" font-weight="600" >비공개는 기존 홈 경로 유지</text>
<text x="1234" y="686" fill="#C9FF3D" font-size="18" font-weight="800" >5. 모바일 우선</text>
<text x="1234" y="714" fill="#F5F7F9" font-size="14" font-weight="600" >좁은 화면 · Safe Area · 44px</text>
<text x="1234" y="737" fill="#F5F7F9" font-size="14" font-weight="600" >터치 영역 · 스크린리더 점검</text>
<path d="M 1234 775 L 1542 775" stroke="#343B44" stroke-width="1" fill="none"/>
<text x="1234" y="806" fill="#9CA5B3" font-size="12" font-weight="600" >주의: 시안은 구조/우선순위 참조용</text>
<text x="1234" y="829" fill="#9CA5B3" font-size="12" font-weight="600" >기존 GND 디자인 토큰으로 구현</text>
<text x="47" y="893" fill="#C5CDD7" font-size="16" font-weight="600" >문구와 수치는 디자인 예시입니다. 실제로는 세션·챌린지 상태를 단일 진실 원천으로 사용하세요.</text>
